<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScamShield</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="header__logo">
      <img src="../icons/icon48.svg" alt="ScamShield" width="24" height="24" />
      <span class="header__title">ScamShield</span>
    </div>
    <span class="header__version">v0.1</span>
  </header>

  <!-- Current site status ------------------------------------------------- -->
  <section class="current-site" id="current-site">
    <div class="current-site__hostname" id="current-hostname">Loading…</div>

    <div class="status-badge" id="status-badge" data-status="unknown">
      <span class="status-badge__icon" id="status-icon">⏳</span>
      <span class="status-badge__label" id="status-label">Checking…</span>
    </div>
  </section>

  <!-- ClickFix detections -------------------------------------------------- -->
  <section class="history">
    <h2 class="history__heading history__heading--threat">ClickFix / ClearFake Threats Detected</h2>
    <ul class="history__list" id="clickfix-history-list">
      <li class="history__empty">No threats detected.</li>
    </ul>
  </section>

  <script src="popup.js" type="module"></script>
</body>
</html>
